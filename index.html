<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cianfrusaglie- Homepage</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .cover-img {
        width: 100%;
        height: 167px;
        aspect-ratio: 2 / 3;
        object-fit: contain;
        object-position: center;
      }
      /* .card {
        height: 40 px;
      } */
    </style>
  </head>
  <body class="bg-warning-subtle">
    <header>
      <div class="container">
        <div class="row">
          <div class="col-12">
            <h1 class="text-center fs-4 fs-sm-3">Benvenuto a <span class="text-danger fs-3 fs-sm-2">Cianfrusaglie! </span></h1>
          </div>
          <div class="col-12"><h2 class="text-center fs-4 fs-sm-3">Vendo tutto ciò che prendo di nascosto dal garage di mio nonno</h2></div>
        </div>
      </div>
    </header>
    <main>
      <div class="container">
        <a href="backoffice-inserimento.html" class="btn btn-danger mb-3">Aggiungi prodotto</a>
        <div class="row" id="cards-show">
          <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <div class="card mb-4 shadow-sm">
              <img src="./assets/place Holder.jpg" class="card-img-top cover-img" alt="product Photo" />
              <div class="card-body">
                <h5 class="card-title">PRODUCT_NAME</h5>
                <p class="card-text">PRODUCT_PRICE€</p>
                <div class="d-flex justify-content-between align-items-center">
                  <!-- <div class="btn-group"> -->
                    <div class="row">
                      <div class="col-12 col-sm-4">
                  <button type="button" class="btn m-1 btn-info">
                    <a href="./details.html?appId=PRODUCT_ID">Scopri di Più</a>
                  </button>
                </div>
                <div class="col-12 col-sm-4">
                  <button type="button" class="btn m-1 btn-info" onclick="handleBuyButton(event)">Aggiungi al carrello</button>
                </div>
                <div class="col-12 col-sm-4"><button type="button" class="btn m-1 btn-info">
                  <a href="./backoffice-modifica.html?appId=PRODUCT_ID">Modifica</a>
                </button></div>
                </div>
                  
                </div>
                </div>
                  <!-- </div> -->
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="index.js"></script>
  </body>
</html>
