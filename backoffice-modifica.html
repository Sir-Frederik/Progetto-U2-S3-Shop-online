<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BackOffice - Cianfrusaglie</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
  </head>

  <body class="bg-warning-subtle">
    <div class="container mt-5">
      <h2 class="mb-4">Aggiungi Nuovo Prodotto</h2>

      <form id="productForm" class="needs-validation" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label">Nome Prodotto</label>
          <input type="text" class="form-control" id="name" required />
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Descrizione</label>
          <textarea class="form-control" id="description" rows="3" required></textarea>
        </div>

        <div class="mb-3">
          <label for="brand" class="form-label">Brand</label>
          <input type="text" class="form-control" id="brand" required />
        </div>

        <div class="mb-3">
          <label for="imageUrl" class="form-label">URL Immagine</label>
          <input type="url" class="form-control" id="imageUrl" required />
        </div>

        <div class="mb-3">
          <label for="price" class="form-label">Prezzo</label>
          <div class="input-group">
            <span class="input-group-text">€</span>
            <input type="number" class="form-control" id="price" min="0" step="0.01" required />
          </div>
        </div>

        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
          <button type="reset" class="btn btn-secondary me-md-2">Reset</button>
          <button type="submit" class="btn btn-primary">Salva Prodotto</button>
        </div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="backoffice-modifica.js"></script>
  </body>
</html>
